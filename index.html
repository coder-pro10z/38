<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Study Dashboard</title>
    
    <!-- Load Inter and JetBrains Mono (Variable Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <style>
        :root {
            /* COLOR SYSTEM */
            --bg-color: #0A0D14;
            --surface-1: #111827;
            --surface-2: #161F2F;
            --surface-3: #1B2435;
            --border: #273244;
            
            --text-primary: #F8FAFC;
            --text-secondary: #CBD5E1;
            --text-muted: #A1A1AA;
            
            --status-error: #F87171;
            --status-warning: #FBBF24;
            --status-success: #34D399;
            --status-info: #60A5FA;
            
            --code-bg: #1e1e2e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            /* Body Typography Default */
            font-family: "Inter", "Segoe UI", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 8px; /* Default Mobile padding for body */
        }

        /* TYPOGRAPHY SYSTEM */
        h1 {
            font-family: "SF Pro Display", "Inter", "Segoe UI", sans-serif;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.15;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: var(--text-primary);
        }

        h2, .card-title {
            font-family: "SF Pro Display", "Inter", "Segoe UI", sans-serif;
            font-size: 18px;
            font-weight: 650;
            letter-spacing: -0.01em;
            line-height: 1.25;
            color: var(--text-primary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        h3, .data-key, .matrix-hdr {
            font-family: "Inter", "Segoe UI", sans-serif;
            font-size: 15px;
            font-weight: 600;
            line-height: 1.3;
            color: var(--text-primary);
        }

        .body-text, .data-val, ul, .rca-step, .timeline-item, .arrow-map, .arch-path, p {
            font-family: "Inter", "Segoe UI", sans-serif;
            font-size: 15px;
            font-weight: 450;
            line-height: 1.6;
            max-width: 80ch; /* Maximum Line Length */
            color: var(--text-secondary);
        }

        .meta, .chip, .badge, .nav-text, .rca-arrow, .matrix-data {
            font-family: "Inter", "Segoe UI", sans-serif;
            font-size: 13px;
            font-weight: 400;
            line-height: 1.45;
            color: var(--text-muted);
        }

        /* Enhanced Code Highlighting */
        code, .code-text {
            font-family: "JetBrains Mono", "SF Mono", "Consolas", monospace;
            font-size: 12px;
            font-weight: 500;
            line-height: 1.3;
            background-color: var(--code-bg);
            color: #a6accd;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #313244;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
            word-break: break-word;
        }

        /* Visual Highlighters */
        .hl-role {
            background: rgba(196, 181, 253, 0.15);
            color: #C4B5FD;
            border: 1px solid rgba(196, 181, 253, 0.3);
            padding: 1px 4px;
            border-radius: 4px;
            font-weight: 500;
            white-space: nowrap;
        }

        .hl-port {
            background: rgba(125, 211, 252, 0.15);
            color: #7DD3FC;
            border: 1px solid rgba(125, 211, 252, 0.3);
            padding: 1px 4px;
            border-radius: 4px;
            font-family: "JetBrains Mono", monospace;
            font-size: 11px;
            white-space: nowrap;
        }

        .action-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 1px 5px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            background: var(--surface-3);
            border: 1px solid var(--border);
            color: var(--text-primary);
        }
        .action-verify, .action-check { color: #60A5FA; background: rgba(96, 165, 250, 0.1); border-color: rgba(96, 165, 250, 0.2); }
        .action-restart, .action-reload { color: #FBBF24; background: rgba(251, 191, 36, 0.1); border-color: rgba(251, 191, 36, 0.2); }
        .action-run, .action-execute { color: #34D399; background: rgba(52, 211, 153, 0.1); border-color: rgba(52, 211, 153, 0.2); }

        /* Subtle Section Backgrounds */
        .card-error {
            background: linear-gradient(135deg, rgba(248, 113, 113, 0.06) 0%, var(--surface-1) 100%) !important;
            border-left: 3px solid var(--status-error) !important;
        }
        .card-rca {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.06) 0%, var(--surface-1) 100%) !important;
            border-left: 3px solid var(--status-warning) !important;
        }
        .card-resolution {
            background: linear-gradient(135deg, rgba(52, 211, 153, 0.06) 0%, var(--surface-1) 100%) !important;
            border-left: 3px solid var(--status-success) !important;
        }
        .card-kill-shot {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1) 0%, var(--surface-1) 100%) !important;
            border: 1px solid var(--status-error) !important;
        }

        /* Top Navigation & Modes */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface-3);
            padding: 8px 12px;
            margin-bottom: 8px;
            position: sticky;
            top: 8px;
            z-index: 100;
            border-radius: 6px;
            border: 1px solid var(--border);
            transition: top 0.3s ease-in-out;
        }

        .nav-btn {
            background: var(--border);
            color: var(--text-primary);
            border: none;
            padding: 6px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.2s;
        }
        .nav-btn:hover:not(:disabled) { background: var(--surface-2); }

        .mode-selector {
            display: flex;
            gap: 4px;
            background: var(--surface-1);
            padding: 4px;
            border-radius: 6px;
        }

        .mode-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 4px 12px;
            border-radius: 4px;
            font-family: "Inter", sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mode-btn.active {
            background: var(--surface-3);
            color: var(--text-primary);
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        /* Mobile Nav Bar Fix */
        @media (max-width: 800px) {
            .nav-bar { flex-wrap: wrap; gap: 8px; justify-content: space-between; }
            .mode-selector { flex-wrap: wrap; justify-content: center; width: 100%; order: 3; }
            .nav-bar > div:first-child { order: 1; }
            #btn-next { order: 2; margin-left: auto; }
            .mode-btn { flex: 1 1 auto; text-align: center; }
        }

        /* Header Layout & Vertical Spacing */
        .header { 
            margin-bottom: 10px; /* Between H1 and H2 */
            padding: 0 4px; 
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .chips { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
        .chip { background: var(--surface-3); padding: 2px 6px; border-radius: 4px; }
        .badge { background: var(--surface-3); padding: 2px 6px; border-radius: 4px; text-transform: uppercase; font-weight: 600;}

        /* Review Summary */
        .review-summary {
            display: flex;
            justify-content: space-between;
            background: var(--surface-2);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
        }
        .summary-val { font-weight: 600; font-size: 13px; }

        /* Dashboard Grid Layout */
        .dashboard { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 8px; 
            padding-bottom: 20px;
            transition: all 0.3s ease;
        }
        
        @media (min-width: 600px) { .dashboard:not(.layout-1col) { grid-template-columns: repeat(2, 1fr); } }

        .dashboard.layout-1col {
            grid-template-columns: 1fr;
            max-width: 900px;
            margin: 0 auto;
        }

        /* Alternating Surfaces */
        .card { padding: 12px; background-color: var(--surface-1); border-radius: 6px; }
        .card:nth-child(even) { background-color: var(--surface-2); }
        @media (min-width: 600px) { .card { padding: 16px; } } 
        @media (min-width: 1024px) { .card { padding: 20px; } } 

        /* Reveal Button */
        .reveal-btn {
            grid-column: 1 / -1;
            width: 100%;
            padding: 12px;
            background: var(--surface-3);
            color: var(--text-primary);
            border: 1px dashed var(--border);
            border-radius: 6px;
            font-family: "Inter", sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin: 4px 0;
        }
        .reveal-btn:hover { background: var(--border); border-style: solid; }

        /* Compact Confidence Rating Buttons */
        .confidence-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
        .conf-btn { 
            padding: 6px 14px; 
            border: 1px solid var(--border); 
            border-radius: 20px; /* Pill shape for compactness */
            background: var(--surface-2); 
            color: var(--text-secondary); 
            cursor: pointer; 
            font-family: "Inter", sans-serif; 
            font-size: 12px; 
            font-weight: 600; 
            text-align: center; 
            transition: all 0.2s; 
        }
        .conf-btn[data-rating="done"]:hover { border-color: var(--status-success); color: var(--status-success); }
        .conf-btn[data-rating="review"]:hover { border-color: #fb923c; color: #fb923c; } 
        .conf-btn[data-rating="revisit"]:hover { border-color: var(--status-warning); color: var(--status-warning); } 
        
        .conf-btn[data-rating="done"].active { background: rgba(52, 211, 153, 0.1); border-color: var(--status-success); color: var(--status-success); }
        .conf-btn[data-rating="review"].active { background: rgba(251, 146, 60, 0.1); border-color: #fb923c; color: #fb923c; }
        .conf-btn[data-rating="revisit"].active { background: rgba(251, 191, 36, 0.1); border-color: var(--status-warning); color: var(--status-warning); }

        /* Vertical Spacing - Rows & Steps */
        .data-row { display: flex; flex-direction: column; margin-bottom: 4px; gap: 2px; }
        @media (min-width: 400px) { .data-row { flex-direction: row; align-items: baseline; gap: 8px; } .data-key { flex: 0 0 120px; } }

        .investigation-list { display: flex; flex-direction: column; gap: 6px; }
        .arrow-map { display: flex; gap: 6px; align-items: baseline; }
        .arrow-map span { color: var(--status-info); font-weight: bold; }

        /* RCA Flow */
        .rca-flow { display: flex; flex-direction: column; gap: 4px; } 
        .rca-step { padding-left: 8px; border-left: 2px solid var(--border); }

        /* Timeline Flow */
        .timeline-item { border-left: 2px solid var(--status-warning); padding-left: 10px; margin-bottom: 4px; position: relative; }
        .timeline-item::before { content: ''; position: absolute; left: -5px; top: 5px; width: 8px; height: 8px; background: var(--status-warning); border-radius: 50%; }

        /* Tradeoff Matrix */
        .matrix { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; }
        .matrix-hdr { border-bottom: 1px solid var(--border); padding-bottom: 2px;}

        /* Architecture Flow Custom */
        .arch-path-vertical {
            text-align: center;
            font-family: "JetBrains Mono", monospace;
            background: var(--code-bg);
            border-radius: 6px;
            padding: 12px;
            border: 1px solid var(--border);
            color: var(--status-success);
            font-size: 13px;
            line-height: 1.8;
        }

        /* Lists */
        ul { margin: 0; padding-left: 16px; display: flex; flex-direction: column; gap: 4px; }
        .no-bullet { list-style-type: none; padding-left: 0; }

        hr { border: 0; border-top: 1px solid var(--border); margin: 8px 0; }

        /* V3 New Components */
        .tag-category { background: rgba(125, 211, 252, 0.1); color: #7DD3FC; padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(125, 211, 252, 0.3); font-size: 11px; font-weight: 600; text-transform: uppercase; }
        
        .arch-diagram {
            font-family: "JetBrains Mono", monospace;
            background: var(--code-bg);
            border-radius: 6px;
            padding: 12px;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-x: auto;
        }

        .dynamic-card {
            border-left: 4px solid var(--status-info);
            padding: 12px;
            background: linear-gradient(135deg, rgba(96, 165, 250, 0.05) 0%, var(--surface-1) 100%);
            border-radius: 6px;
            margin-bottom: 8px;
        }
        .dynamic-card.type-compare { border-left-color: var(--status-warning); background: linear-gradient(135deg, rgba(251, 191, 36, 0.05) 0%, var(--surface-1) 100%); }
        .dynamic-card.type-pro-tip { border-left-color: var(--status-success); background: linear-gradient(135deg, rgba(52, 211, 153, 0.05) 0%, var(--surface-1) 100%); }
        .dynamic-card.type-code-snippet { border-left-color: #C4B5FD; background: linear-gradient(135deg, rgba(196, 181, 253, 0.05) 0%, var(--surface-1) 100%); }

        .collapsible-trigger {
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .collapsible-trigger:hover { opacity: 0.8; }
        .collapsible-content {
            display: none;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed var(--border);
        }
        .collapsible-content.expanded { display: block; }

        .rapid-fire-item {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 8px;
            overflow: hidden;
        }
        .rapid-fire-q {
            padding: 12px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            gap: 8px;
            align-items: flex-start;
            transition: background 0.2s;
        }
        .rapid-fire-q:hover { background: var(--surface-3); }
        .rapid-fire-a {
            display: none;
            padding: 12px;
            background: var(--surface-1);
            border-top: 1px solid var(--border);
            color: #FCA5A5;
            font-style: italic;
        }
        .rapid-fire-a.expanded { display: block; }

        /* K8s Specific Components */
        .compare-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 8px;
            align-items: center;
            padding: 8px;
            background: var(--surface-2);
            border-radius: 6px;
            margin-bottom: 6px;
        }
        .compare-vs { color: var(--status-warning); font-weight: 700; font-size: 12px; text-align: center; }
        .compare-label { font-weight: 600; color: var(--text-primary); font-size: 13px; }

        .code-block-card {
            background: var(--code-bg);
            border: 1px solid #313244;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .code-block-header {
            padding: 6px 10px;
            background: rgba(49, 50, 68, 0.6);
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            border-bottom: 1px solid #313244;
        }
        .code-block-body {
            padding: 10px;
            font-family: "JetBrains Mono", monospace;
            font-size: 12px;
            color: #a6accd;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .obs-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        @media (min-width: 600px) { .obs-grid { grid-template-columns: repeat(4, 1fr); } }
        .obs-section { background: var(--surface-2); padding: 8px; border-radius: 6px; }
        .obs-section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }

        .trade-off-card {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 6px;
        }
        .trade-off-title { font-weight: 700; color: var(--status-info); font-size: 14px; margin-bottom: 6px; }
        .trade-off-row { display: flex; gap: 6px; flex-wrap: wrap; }
        .trade-off-pro { background: rgba(52, 211, 153, 0.1); color: var(--status-success); padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; }
        .trade-off-con { background: rgba(248, 113, 113, 0.1); color: var(--status-error); padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; }

        .pill-list { display: flex; flex-direction: column; gap: 8px; }
        .pill-item { 
            background: var(--surface-3); 
            border: 1px solid var(--border); 
            padding: 12px 16px; 
            border-radius: 8px; 
            font-size: 14px; 
            line-height: 1.5;
            color: var(--text-primary); 
        }
        .pill-item.warn { border-left: 4px solid #FBBF24; background: rgba(251, 191, 36, 0.06); }
        .pill-item.info { border-left: 4px solid #60A5FA; background: rgba(96, 165, 250, 0.06); }
        .pill-item.link { border-left: 4px solid #C4B5FD; background: rgba(196, 181, 253, 0.06); }

        /* Index Modal Styles */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 13, 20, 0.85); backdrop-filter: blur(4px);
            z-index: 999; display: flex; justify-content: center; align-items: flex-end;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: var(--surface-1); width: 100%; max-width: 800px;
            height: 85vh; border-radius: 12px 12px 0 0;
            border-top: 1px solid var(--border);
            display: flex; flex-direction: column;
            transform: translateY(100%); transition: transform 0.3s;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--border); }
        .modal-header h2 { margin: 0; font-size: 18px; color: var(--text-primary); font-family: "SF Pro Display", "Inter", sans-serif; }
        .btn-close { background: transparent; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; padding: 4px; }
        .btn-close:hover { color: var(--text-primary); }
        .index-list { overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .index-item {
            background: var(--surface-2); padding: 12px; border-radius: 6px;
            border: 1px solid var(--border); cursor: pointer; display: flex;
            justify-content: space-between; align-items: center; gap: 8px;
            transition: border-color 0.2s;
        }
        .index-item:hover { border-color: var(--status-info); }
        .index-item.active { border-color: var(--status-success); background: var(--surface-3); }

        /* Helpers */
        .text-error { color: var(--status-error) !important; }
        .text-success { color: var(--status-success) !important; }
        .text-warning { color: var(--status-warning) !important; }
        .text-info { color: var(--status-info) !important; }

        /* Slide Search Styles */
        .search-container {
            position: relative;
            flex: 1;
            max-width: 400px;
            min-width: 200px;
        }
        .search-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .search-icon {
            position: absolute;
            left: 10px;
            color: var(--text-muted);
            font-size: 14px;
            pointer-events: none;
        }
        #search-input {
            width: 100%;
            padding: 6px 30px 6px 30px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        #search-input:focus {
            border-color: var(--status-info);
            box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.2);
            background: var(--surface-3);
        }
        #search-clear-btn {
            position: absolute;
            right: 10px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: none;
            font-size: 12px;
            padding: 4px;
            line-height: 1;
        }
        #search-clear-btn:hover {
            color: var(--text-primary);
        }
        #search-results-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            max-height: 320px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            display: none;
            flex-direction: column;
            gap: 2px;
            padding: 6px;
        }
        .search-result-item {
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            display: flex;
            flex-direction: column;
            gap: 4px;
            border: 1px solid transparent;
            text-align: left;
        }
        .search-result-item:hover, .search-result-item.focus-item {
            background: var(--surface-3);
            border-color: var(--status-info);
        }
        .search-result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .search-result-title {
            font-weight: 600;
            font-size: 13px;
            color: var(--text-primary);
        }
        .search-result-reason {
            font-size: 10px;
            padding: 1px 6px;
            background: rgba(96, 165, 250, 0.15);
            color: #60A5FA;
            border: 1px solid rgba(96, 165, 250, 0.3);
            border-radius: 4px;
            white-space: nowrap;
        }
        .search-result-snippet {
            font-size: 11px;
            color: var(--text-muted);

<script>
// State Management
let currentMode = 'learn'; // 'learn', 'practice', 'review'
let solutionRevealed = false;
let currentIndex = 0;
let ratings = {}; // Maps index to 'done', 'review', 'revisit'
try {
    const saved = localStorage.getItem('k8s_dashboard_ratings');

} catch (e) {

}
try {

    if (saved) ratings = JSON.parse(saved);
} catch (e) {
    console.error('Failed to load ratings:', e);
}
let isOneColumn = true; // Default to 1 Column for better reading

// DYNAMIC GLOSSARY & FLASHCARD STATE
let glossary = [];
let keywordLinks = {};
let keywordsRegex = null;
let activeGlossaryId = null;
let activeGlossaryCategory = 'All';
let flashcardsList = [];
let currentFlashcardIndex = 0;
let flashcardFlipped = false;
let flashcardsProgress = {};

try {
    const saved = localStorage.getItem('devops_flashcards_progress');
    if (saved) flashcardsProgress = JSON.parse(saved);
} catch (e) {
    console.error('Failed to load flashcard progress:', e);
}

function prepareKeywordsRegex() {
    if (keywordsRegex) return;
    if (!glossary || glossary.length === 0) return;
    
    const terms = [];
    const termToId = {};
    
    glossary.forEach(g => {
        terms.push(g.keyword);
        termToId[g.keyword.toLowerCase()] = g.keywordId;
        
        if (g.aliases) {
            g.aliases.forEach(a => {
                terms.push(a);
                termToId[a.toLowerCase()] = g.keywordId;
            });
        }
    });
    
    // Sort longer terms first to prevent partial/sub-term overrides
    terms.sort((a, b) => b.length - a.length);
    
    // Escape regex characters
    const escapedTerms = terms.map(t => t.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&'));
    
    keywordsRegex = {
        regex: new RegExp(`\\b(${escapedTerms.join('|')})\\b`, 'gi'),
        termToId: termToId
    };
}

function toggleLayout() {
    isOneColumn = !isOneColumn;
    const db = document.getElementById('dashboard');
    const btn = document.getElementById('btn-layout');
    if (isOneColumn) {
        db.classList.add('layout-1col');
        btn.innerHTML = '📖 1 Col';
    } else {
        db.classList.remove('layout-1col');
        btn.innerHTML = '📚 2 Col';
    }
}

// Format helper to highlight specific syntax dynamically
function format(text) {
    if (!text) return '';
    const parts = String(text).split(/(<code>.*?<\/code>)/gi);
    for (let i = 0; i < parts.length; i++) {
        if (!parts[i].toLowerCase().startsWith('<code>')) {
            let s = parts[i];
            
            // Highlight Roles
            s = s.replace(/\b(Management Group Contributor|Contributor|Reader|Admin|db_datareader|db_datawriter)\b/gi, '<span class="hl-role">$&</span>');
            
            // Highlight Ports & IPs
            s = s.replace(/\b(port \d+|1433|443|80|8080|0\.0\.0\.0)\b/gi, '<span class="hl-port">$&</span>');
            
            // Highlight Actions with Badges
            s = s.replace(/\b(Verify|Check|Restart|Reload|Run|Execute)\b/gi, (match) => {
                let lower = match.toLowerCase();
                let icon = '⚡';
                if (lower === 'verify') icon = '🛡️';
                if (lower === 'check') icon = '🔍';
                if (lower === 'restart') icon = '🔄';
                if (lower === 'reload') icon = '🔁';
                if (lower === 'run') icon = '▶️';
                return `<span class="action-badge action-${lower}">${icon} ${match}</span>`;
            });

            // Dynamic Glossary Keyword Highlighting!
            if (keywordsRegex) {
                s = s.replace(keywordsRegex.regex, (match) => {
                    const id = keywordsRegex.termToId[match.toLowerCase()];
                    if (id) {
                        return `<span class="glossary-link" data-keyword-id="${id}">${match}</span>`;
                    }
                    return match;
                });
            }
            
            parts[i] = s;
        }
    }
    return parts.join('');
}

// GLOSSARY & FLASHCARDS CORE FUNCTIONS
async function jumpToSource(ref) {
    let titleToSearch = '';
    if (typeof ref === 'string') {
        const parts = ref.split(': ');
        if (parts.length > 1) {
            titleToSearch = parts.slice(1).join(': ');
        } else {
            titleToSearch = ref;
        }
    } else if (ref.scenarioTitle) {
        titleToSearch = ref.scenarioTitle;
    } else if (ref.slideTopic) {
        titleToSearch = ref.slideTopic;
    }
    
    if (titleToSearch) {
        const cleanTitle = titleToSearch.toLowerCase().trim();
        const foundIndex = scenarios.findIndex(s => s.title.toLowerCase().trim() === cleanTitle);
        if (foundIndex !== -1) {
            currentIndex = foundIndex;
            solutionRevealed = false;
            
            // Close drawers and modals
            const drawer = document.getElementById('glossary-drawer');
            if (drawer) drawer.classList.remove('active');
            const modal = document.getElementById('index-modal');
            if (modal) modal.classList.remove('active');
            
            setMode('learn');
            return true;
        }
        
        // Check defaultScenarios
        let altIndex = defaultScenarios.findIndex(s => s.title.toLowerCase().trim() === cleanTitle);
        if (altIndex !== -1) {
            await selectDataset('default');
            currentIndex = altIndex;
            solutionRevealed = false;
            const drawer = document.getElementById('glossary-drawer');
            if (drawer) drawer.classList.remove('active');
            const modal = document.getElementById('index-modal');
            if (modal) modal.classList.remove('active');
            setMode('learn');
            return true;
        }
        
        // Check hexaviewR1Scenarios
        if (hexaviewR1Scenarios.length === 0) {
            try {
                const res = await fetch('hexaview_r1.json');
                if (res.ok) hexaviewR1Scenarios = await res.json();
            } catch(e) { console.error('Failed to pre-fetch hexaview R1:', e); }
        }
        altIndex = hexaviewR1Scenarios.findIndex(s => s.title.toLowerCase().trim() === cleanTitle);
        if (altIndex !== -1) {
            await selectDataset('hexaview_r1');
            currentIndex = altIndex;
            solutionRevealed = false;
            const drawer = document.getElementById('glossary-drawer');
            if (drawer) drawer.classList.remove('active');
            const modal = document.getElementById('index-modal');
            if (modal) modal.classList.remove('active');
            setMode('learn');
            return true;
        }
        
        // Check hexaviewR2Scenarios
        if (hexaviewR2Scenarios.length === 0) {
            try {
                const res = await fetch('hexaview_r2.json');
                if (res.ok) hexaviewR2Scenarios = await res.json();
            } catch(e) { console.error('Failed to pre-fetch hexaview R2:', e); }
        }
        altIndex = hexaviewR2Scenarios.findIndex(s => s.title.toLowerCase().trim() === cleanTitle);
        if (altIndex !== -1) {
            await selectDataset('hexaview_r2');
            currentIndex = altIndex;
            solutionRevealed = false;
            const drawer = document.getElementById('glossary-drawer');
            if (drawer) drawer.classList.remove('active');
            const modal = document.getElementById('index-modal');
            if (modal) modal.classList.remove('active');
            setMode('learn');
            return true;
        }
        
        // Check noventiqR1Scenarios
        if (noventiqR1Scenarios.length === 0) {
            try {
                const res = await fetch('noventiq_r1.json');
                if (res.ok) noventiqR1Scenarios = await res.json();
            } catch(e) { console.error('Failed to pre-fetch noventiq R1:', e); }
        }
        altIndex = noventiqR1Scenarios.findIndex(s => s.title.toLowerCase().trim() === cleanTitle);
        if (altIndex !== -1) {
            await selectDataset('noventiq_r1');
            currentIndex = altIndex;
            solutionRevealed = false;
            const drawer = document.getElementById('glossary-drawer');
            if (drawer) drawer.classList.remove('active');
            const modal = document.getElementById('index-modal');
            if (modal) modal.classList.remove('active');
            setMode('learn');
            return true;
        }
    }
    
    if (typeof ref === 'string') {
        const scMatch = ref.match(/^SC-(\d+):/);
        if (scMatch) {
            const idx = parseInt(scMatch[1], 10);
            if (idx >= 0 && idx < scenarios.length) {
                currentIndex = idx;
                solutionRevealed = false;
                
                const drawer = document.getElementById('glossary-drawer');
                if (drawer) drawer.classList.remove('active');
                const modal = document.getElementById('index-modal');
                if (modal) modal.classList.remove('active');
                
                setMode('learn');
                return true;
            }
        }
    }
    return false;
}

function showGlossaryDrawer(id) {
    const term = glossary.find(g => g.keywordId === id);
    if (!term) return;

function renderGlossaryView() {
    const dashboard = document.getElementById('dashboard');
    
    document.getElementById('q-title').innerText = "DevOps Glossary Explorer";
    document.getElementById('q-chips').innerHTML = `
        <button class="nav-btn" onclick="setMode('learn')" style="background:var(--surface-3); border:1px solid var(--border); font-size:12px; margin-right:8px; padding: 4px 10px;">← Back to slides</button>
        <span class="meta" style="margin-left: 8px; margin-right:4px;">Filter by Category:</span>
        <button class="glossary-filter-btn ${activeGlossaryCategory === 'All' ? 'active' : ''}" onclick="filterGlossaryByCategory('All')">All</button>
        ${getGlossaryCategories().map(cat => `
            <button class="glossary-filter-btn ${activeGlossaryCategory === cat ? 'active' : ''}" onclick="filterGlossaryByCategory('${cat}')">${cat}</button>
        `).join('')}
    `;
    
    document.getElementById('counter').innerText = `Glossary Explorer`;

    // Filter keywords
    let filtered = glossary;
    if (activeGlossaryCategory !== 'All') {
        filtered = glossary.filter(g => g.category === activeGlossaryCategory);
    }
    
    // Check if we have an active ID, else select first
    if (filtered.length > 0) {
        if (!activeGlossaryId || !filtered.some(g => g.keywordId === activeGlossaryId)) {
            activeGlossaryId = filtered[0].keywordId;
        }
    } else {
        activeGlossaryId = null;
    }
    
    // Build the grid layout
    dashboard.innerHTML = `
        <div class="glossary-layout" style="grid-column: 1/-1;">
            <div class="glossary-sidebar">
                <div class="glossary-search-box">
                    <input type="text" id="glossary-search-input" placeholder="Filter current list..." oninput="filterGlossarySidebarList()">
                </div>
                <div class="glossary-list" id="glossary-sidebar-list">
                    ${filtered.map(g => `
                        <div class="glossary-item ${g.keywordId === activeGlossaryId ? 'active' : ''}" data-id="${g.keywordId}" onclick="showGlossaryTerm('${g.keywordId}')">
                            <span class="glossary-item-title">${g.keyword}</span>
                            <span class="glossary-item-meta">${g.category}</span>
                        </div>
                    `).join('')}
                </div>
            </div>
            <div class="glossary-main" id="glossary-details-pane">
                ${activeGlossaryId ? getGlossaryTermDetailsHtml(glossary.find(g => g.keywordId === activeGlossaryId)) : '<div class="body-text" style="padding:20px; text-align:center;">No term selected</div>'}
            </div>
        </div>
    `;
    
    const layoutBtn = document.getElementById('btn-layout');
    if (layoutBtn) layoutBtn.style.display = 'none';
}

function getGlossaryCategories() {
    const categories = new Set();
    glossary.forEach(g => {
        if (g.category) categories.add(g.category);
    });
    return Array.from(categories).sort();
}

function filterGlossaryByCategory(category) {
    activeGlossaryCategory = category;
    renderGlossaryView();
}

function filterGlossarySidebarList() {
    const query = document.getElementById('glossary-search-input').value.toLowerCase().trim();
    const items = document.querySelectorAll('.glossary-item');
    items.forEach(item => {
        const title = item.querySelector('.glossary-item-title').innerText.toLowerCase();
        const meta = item.querySelector('.glossary-item-meta').innerText.toLowerCase();
        if (title.includes(query) || meta.includes(query)) {
            item.style.display = 'flex';
        } else {
            item.style.display = 'none';
        }
    });
}

function showGlossaryTerm(id) {
    activeGlossaryId = id;
    
    if (currentMode !== 'glossary') {
        setMode('glossary');
        return;
    }
    
    const term = glossary.find(g => g.keywordId === id);
    if (!term) return;
    
    document.querySelectorAll('.glossary-item').forEach(item => {
        item.classList.toggle('active', item.dataset.id === id);
    });
    
    const pane = document.getElementById('glossary-details-pane');
    if (pane) {
        pane.innerHTML = getGlossaryTermDetailsHtml(term);
        pane.scrollTop = 0;
    }
    
    const activeItem = document.querySelector(`.glossary-item[data-id="${id}"]`);
    if (activeItem) {
        activeItem.scrollIntoView({ block: 'nearest' });
    }
}

function toggleFlashcardFlip() {
    flashcardFlipped = !flashcardFlipped;
    const fcBody = document.getElementById('flashcard-body');
    if (fcBody) {
        fcBody.classList.toggle('flipped', flashcardFlipped);
    }
}

function navigateFlashcard(dir) {
    if (flashcardsList.length === 0) return;
    currentFlashcardIndex += dir;
    if (currentFlashcardIndex < 0) currentFlashcardIndex = flashcardsList.length - 1;
    if (currentFlashcardIndex >= flashcardsList.length) currentFlashcardIndex = 0;
    flashcardFlipped = false;
    renderFlashcardsView();
}

function shuffleFlashcards() {
    if (flashcardsList.length === 0) return;
    for (let i = flashcardsList.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [flashcardsList[i], flashcardsList[j]] = [flashcardsList[j], flashcardsList[i]];
    }
    currentFlashcardIndex = 0;
    flashcardFlipped = false;
    renderFlashcardsView();
}

function rateFlashcard(rating) {
    const term = flashcardsList[currentFlashcardIndex];
    if (!term) return;
    
    flashcardsProgress[term.keywordId] = rating;
    try {
        localStorage.setItem('devops_flashcards_progress', JSON.stringify(flashcardsProgress));
    } catch (e) {
        console.error('Failed to save flashcard progress:', e);
    }
    
    // Quick flip animation indicator, then next card
    setTimeout(() => {
        navigateFlashcard(1);
    }, 200);
}

        optHexR2.classList.remove('active-item');
        optHexR2.querySelector('span').innerText = '';
        optNovR1.classList.remove('active-item');
        optNovR1.querySelector('span').innerText = '';

                hexaviewR1Scenarios = await res.json();

        } else if (type === 'hexaview_r2') {

                if (!res.ok) throw new Error("Could not load Hexaview R2 dataset");
                hexaviewR2Scenarios = await res.json();
            }
            scenarios = hexaviewR2Scenarios;
            
            ratings = {};
            try {

                if (saved) ratings = JSON.parse(saved);
            } catch(e) { console.error('Failed to load hexaview R2 ratings:', e); }
        } else if (type === 'noventiq_r1') {
            if (noventiqR1Scenarios.length === 0) {
                const res = await fetch('noventiq_r1.json');
                if (!res.ok) throw new Error("Could not load Noventiq R1 dataset");
                noventiqR1Scenarios = await res.json();
            }
            scenarios = noventiqR1Scenarios;
            
            ratings = {};
            try {
                const saved = localStorage.getItem('noventiq_r1_ratings');
                if (saved) ratings = JSON.parse(saved);
            } catch(e) { console.error('Failed to load noventiq R1 ratings:', e); }
        } else {
            scenarios = defaultScenarios;
            
            ratings = {};
            try {
                const saved = localStorage.getItem('k8s_dashboard_ratings');
                if (saved) ratings = JSON.parse(saved);

async function loadScenarios() {
    try {
        const [scenariosRes, glossaryRes, linksRes] = await Promise.all([
            fetch('scenarios.json'),
            fetch('glossary.json'),
            fetch('keyword-links.json')
        ]);
        
        if (!scenariosRes.ok) throw new Error(`Scenarios error: ${scenariosRes.status}`);
        scenarios = await scenariosRes.json();
        defaultScenarios = scenarios;
        
        if (glossaryRes.ok) {
            glossary = await glossaryRes.json();
        } else {
            console.warn("Could not load glossary.json, glossary features will be disabled.");
        }
        
        if (linksRes.ok) {
            const linksData = await linksRes.json();
            keywordLinks = {};
            linksData.forEach(item => {
                keywordLinks[item.keywordId] = item.mentionedIn;
            });
        }
        
        // Prepare keyword mapping for on-the-fly highlighting
        prepareKeywordsRegex();
        
        // Initialize layout preference
        if (isOneColumn) {
            const db = document.getElementById('dashboard');
            if (db) db.classList.add('layout-1col');
        }

        // Initialize first render after data is loaded
        renderScenario();
    } catch (error) {
        console.error('Failed to load dashboard data:', error);
        document.getElementById('dashboard').innerHTML = `
            <div class="card" style="grid-column: 1/-1; padding: 20px; border-left: 4px solid var(--status-error);">

                <p class="body-text" style="margin-bottom: 8px;">

                </p>
                <p class="body-text" style="margin-top: 12px; color: var(--text-muted);">
                    If you are opening this HTML file directly via the <code>file://</code> protocol in your browser, 
                    local fetch requests are blocked by default due to Cross-Origin Resource Sharing (CORS) security policies.

                    To view the dashboard, please run a local web server in this directory:

function getActiveIndices() {
    if (currentMode === 'review') {
        const active = scenarios.map((_, i) => i).filter(i => ratings[i] !== 'done');
        return active.length ? active : [-1];
    }
    return scenarios.map((_, i) => i);
}

function renderIndex() {
    const list = document.getElementById('index-list');
    const activeIndices = getActiveIndices();
    
    let html = '';
    if (activeIndices[0] === -1) {
        html = `<div class="body-text" style="text-align:center; padding: 20px;">No scenarios to review!</div>`;
    } else {
        activeIndices.forEach((scenarioIdx, displayIdx) => {
            const s = scenarios[scenarioIdx];
            const rating = ratings[scenarioIdx];
            let indicator = '⚪'; // Default unrated
            if (rating === 'done') indicator = '🟢';
            if (rating === 'review') indicator = '🟠';
            if (rating === 'revisit') indicator = '🟡';
            
            const isActive = scenarioIdx === currentIndex ? 'active' : '';
            
            // Build compact chips for the index preview
            const visibleChips = s.chips.slice(0, 4);
            const extraChipsCount = s.chips.length - visibleChips.length;
            const chipsHtml = visibleChips.map(c => `<span style="background: var(--surface-1); padding: 2px 6px; border-radius: 4px; font-size: 10px; border: 1px solid var(--border); color: var(--text-muted);">${c}</span>`).join('');
            const extraHtml = extraChipsCount > 0 ? `<span style="padding: 2px 4px; font-size: 10px; color: var(--text-muted);">+${extraChipsCount}</span>` : '';
            
            html += `
            <div class="index-item ${isActive}" data-target="${scenarioIdx}">
                <div style="flex: 1;">
                    <div class="meta" style="color: var(--status-info); font-weight: 600;">${displayIdx + 1}. ${s.type}</div>
                    <div class="body-text" style="font-weight: 600; color: var(--text-primary); margin-top:2px; font-size: 14px;">${s.title}</div>
                    <div style="margin-top: 6px; display: flex; gap: 4px; flex-wrap: wrap;">
                        ${chipsHtml}${extraHtml}
                    </div>
                </div>
                <div style="font-size: 16px; margin-left: 12px; flex-shrink: 0;" title="Status: ${rating || 'Unrated'}">${indicator}</div>
            </div>`;
        });
    }
    list.innerHTML = html;
}

function setMode(mode) {
    currentMode = mode;
    solutionRevealed = false;
    
    const isStandardMode = ['learn', 'practice', 'review'].includes(mode);
    const layoutBtn = document.getElementById('btn-layout');
    const prevBtn = document.getElementById('btn-prev');
    const nextBtn = document.getElementById('btn-next');
    
    if (layoutBtn) layoutBtn.style.display = isStandardMode ? 'inline-block' : 'none';
    if (prevBtn) prevBtn.style.display = isStandardMode ? 'inline-block' : 'none';
    if (nextBtn) nextBtn.style.display = isStandardMode ? 'inline-block' : 'none';
    
    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
    });

    const active = getActiveIndices();
    if (active[0] !== -1 && !active.includes(currentIndex)) {
        currentIndex = active[0];
    }
    
    renderScenario();
}

function toggleReveal() {
    solutionRevealed = !solutionRevealed;
    renderScenario();
}

function setConfidence(rating) {
    ratings[currentIndex] = rating;
    try {
        let storageKey = 'k8s_dashboard_ratings';
        if (currentDataset === 'hexaview_r1') {
            storageKey = 'hexaview_r1_ratings';
        } else if (currentDataset === 'hexaview_r2') {
            storageKey = 'hexaview_r2_ratings';
        }
        localStorage.setItem(storageKey, JSON.stringify(ratings));
    } catch (e) {
        console.error('Failed to save ratings:', e);
    }
    renderScenario();
}

function nav(direction) {
    const active = getActiveIndices();
    if (active[0] === -1) return;
    
    let currentActiveIndex = active.indexOf(currentIndex);
    if (currentActiveIndex === -1) {
        currentActiveIndex = 0;
    } else {
        currentActiveIndex += direction;
        if (currentActiveIndex < 0) currentActiveIndex = active.length - 1;
        if (currentActiveIndex >= active.length) currentActiveIndex = 0;
    }
    currentIndex = active[currentActiveIndex];
    solutionRevealed = false;
    renderScenario();
}

                ${d.timeline.map(t => `<div class="timeline-item"><h3 style="display:inline">${t.t}:</h3> <span class="body-text">${format(t.ev)}</span></div>`).join('')}
            </div>
            <div class="card card-rca">
                <h2 class="card-title">🎯 RCA</h2>
                <div class="rca-flow">
                    <div class="rca-step"><h3 style="display:inline">Problem:</h3> <span class="body-text">${format(d.rca[0])}</span></div>
                    <div class="rca-arrow">↓</div>
                    <div class="rca-step"><h3 style="display:inline">Trigger:</h3> <span class="body-text">${format(d.rca[1])}</span></div>
                    <div class="rca-arrow">↓</div>
                    <div class="rca-step"><h3 style="display:inline">Root Cause:</h3> <span class="body-text">${format(d.rca[2])}</span></div>
                    <div class="rca-arrow">↓</div>
                    <div class="rca-step"><h3 style="display:inline">Impact:</h3> <span class="body-text">${format(d.rca[3])}</span></div>
                </div>
            </div>
            <div class="card card-resolution">
                <h2 class="card-title">✅ Resolution & 📚 Lessons</h2>
                <div class="data-row"><h3 class="data-key">Mitigation</h3><div class="data-val"><code>${d.resolutionImmediate}</code></div></div>
                <div class="data-row"><h3 class="data-key">Permanent Fix</h3><div class="data-val">${format(d.resolutionPerm)}</div></div>
                <hr>
                <ul class="no-bullet">
                    ${d.practices.map(p => `<li class="body-text"><span class="text-${p.type}">${format(p.text)}</span></li>`).join('')}
                </ul>
            </div>`;
            solutionHtml += `</div>`;
        } else if (s.type === 'Decision' || s.type === 'Architecture') {
            const icon = s.type === 'Decision' ? '🎯 Decision' : '📋 Requirements';
            solutionHtml += `
            <div class="card">
                <h2 class="card-title">${icon}</h2>
                <div class="body-text" style="margin-bottom:8px;">${format(d.reqs)}</div>
                <div class="arch-path">${d.architecture}</div>
            </div>
            <div class="card">
                <h2 class="card-title">⚖ Tradeoffs</h2>
                <div class="matrix">
                    <div class="matrix-hdr">${d.tradeoffs[0].h1}</div><div class="matrix-hdr">${d.tradeoffs[0].h2}</div><div class="matrix-hdr">${d.tradeoffs[0].h3}</div>
                    <div class="matrix-data">${d.tradeoffs[1].d1}</div><div class="matrix-data">${d.tradeoffs[1].d2}</div><div class="matrix-data">${d.tradeoffs[1].d3}</div>
                    <div class="matrix-data">${d.tradeoffs[2].d1}</div><div class="matrix-data">${d.tradeoffs[2].d2}</div><div class="matrix-data">${d.tradeoffs[2].d3}</div>
                    <div class="matrix-data">${d.tradeoffs[3].d1}</div><div class="matrix-data text-warning">${d.tradeoffs[3].d2}</div><div class="matrix-data text-warning">${d.tradeoffs[3].d3}</div>
                </div>
            </div>
            <div class="card card-resolution">
                <h2 class="card-title">🔧 Operations / Cost</h2>
                <div class="investigation-list">
                    ${d.cost.map(i => `<div class="data-row"><h3 class="data-key">${i.k}</h3><div class="data-val">${format(i.v)}</div></div>`).join('')}
                </div>
            </div>`;
        }

        solutionHtml += `
            <div class="card">
                <h2 class="card-title">💬 Interview Answer</h2>
                <ul>${d.answer.map(a => `<li class="body-text">"${format(a)}"</li>`).join('')}</ul>
            </div>`;
            
        alwaysVisibleHtml += `
            <div class="card" style="grid-column: 1/-1;">
                <h2 class="card-title">🧠 Quick Recall</h2>
                <ul>${d.recall.map(r => `<li class="body-text">${format(r)}</li>`).join('')}</ul>
            </div>`;
    }

    // Assembly of Final DOM
    let html = '';

    if (currentMode === 'rapid_fire') {
        if (s.rapid_fire_qa && s.rapid_fire_qa.length > 0) {
            html += `
            <div class="card" style="grid-column: 1/-1;">
                <h2 class="card-title text-warning">⚡ Rapid Fire Q&A</h2>
                ${s.rapid_fire_qa.map(qa => `
                    <div class="rapid-fire-item">
                        <div class="rapid-fire-q" onclick="this.nextElementSibling.classList.toggle('expanded')">
                            <span style="color:var(--status-info)">Q:</span> 
                            <span>${format(qa.question)}</span>
                        </div>
                        <div class="rapid-fire-a">
                            <strong style="color:var(--text-primary)">Kill Shot:</strong> "${format(qa.kill_shot_answer)}"
                        </div>
                    </div>
                `).join('')}
            </div>`;
        } else {
            html += `
            <div class="card" style="grid-column: 1/-1; text-align: center; padding: 40px;">
                <h2 class="card-title text-warning" style="justify-content: center;">No Rapid Fire Q&A</h2>
                <p class="body-text">This scenario does not have rapid fire questions available.</p>
            </div>`;
        }
    } else if (currentMode === 'follow_up') {
        if (s.follow_up_questions && s.follow_up_questions.length > 0) {
            html += `
            <div class="card" style="grid-column: 1/-1;">
                <h2 class="card-title" style="color:#C4B5FD;">🔗 Follow-Up Questions</h2>
                <ul style="margin-top: 12px; padding-left: 20px;">
                    ${s.follow_up_questions.map(q => `<li class="body-text" style="margin-bottom:8px;">${format(q)}</li>`).join('')}
                </ul>
            </div>`;
        } else {
            html += `
            <div class="card" style="grid-column: 1/-1; text-align: center; padding: 40px;">
                <h2 class="card-title text-warning" style="justify-content: center;">No Follow-Up Questions</h2>
                <p class="body-text">This scenario does not have follow-up questions yet.</p>
            </div>`;
        }
    } else {
        if (currentMode === 'practice') {
            html += `<button class="reveal-btn" id="btn-reveal">
                ${solutionRevealed ? 'Hide Solution' : 'Reveal Solution'}
            </button>`;
            if (solutionRevealed) {
                html += solutionHtml;
            }
        } else {
            html += solutionHtml;
        }

        html += alwaysVisibleHtml;
    }

    // Confidence Rating
    const currentRating = ratings[currentIndex] || '';
    html += `
        <div class="card" style="grid-column: 1/-1;">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
                <h2 class="card-title" style="margin:0; font-size: 15px;">Confidence Rating</h2>
                <div class="confidence-buttons">
                    <button class="conf-btn ${currentRating==='done'?'active':''}" data-rating="done">🟢 Done</button>
                    <button class="conf-btn ${currentRating==='review'?'active':''}" data-rating="review">🟠 Review</button>
                    <button class="conf-btn ${currentRating==='revisit'?'active':''}" data-rating="revisit">🟡 Revisit</button>
                </div>
            </div>
        </div>`;

    dashboard.innerHTML = html;
}

// Global click event delegation
document.addEventListener('click', function(e) {
    if (e.target.closest('#btn-prev')) nav(-1);
    if (e.target.closest('#btn-next')) nav(1);
    
    // Toggle Interviews dropdown
    if (e.target.closest('#btn-interviews-tab')) {
        const menu = document.getElementById('interviews-menu');
        if (menu) menu.classList.toggle('active');
    }
    // Close Interviews dropdown when clicking outside
    if (!e.target.closest('.interviews-dropdown-container')) {
        const menu = document.getElementById('interviews-menu');
        if (menu) menu.classList.remove('active');
    }
    
    const modeBtn = e.target.closest('.mode-btn');
    if (modeBtn && modeBtn.dataset.mode) setMode(modeBtn.dataset.mode);

    if (e.target.closest('#btn-reveal')) toggleReveal();

    const confBtn = e.target.closest('.conf-btn');
    if (confBtn) setConfidence(confBtn.dataset.rating);
    
    // Index Modal Controls
    if (e.target.closest('#counter')) {
        renderIndex();
        document.getElementById('index-modal').classList.add('active');
    }
    if (e.target.closest('#btn-close-index') || e.target.classList.contains('modal-overlay')) {
        document.getElementById('index-modal').classList.remove('active');
    }
    const indexItem = e.target.closest('.index-item');
    if (indexItem) {
        currentIndex = parseInt(indexItem.dataset.target, 10);
        solutionRevealed = false;
        document.getElementById('index-modal').classList.remove('active');
        renderScenario();
    }

    // Glossary Link Click
    const glossaryLink = e.target.closest('.glossary-link');
    if (glossaryLink) {
        showGlossaryDrawer(glossaryLink.dataset.keywordId);
    }

    // Glossary Drawer Close Controls
    if (e.target.closest('#btn-close-drawer')) {
        document.getElementById('glossary-drawer').classList.remove('active');
    }
    
    // Click outside drawer to close it (except when clicking a glossary link or search result)
    if (!e.target.closest('#glossary-drawer') && !e.target.closest('.glossary-link') && !e.target.closest('.search-result-item') && !e.target.closest('.pill-item-clickable')) {
        const drawer = document.getElementById('glossary-drawer');
        if (drawer) drawer.classList.remove('active');
    }
});

document.addEventListener('keydown', function(event) {
    if (event.key === "ArrowLeft") nav(-1);
    if (event.key === "ArrowRight") nav(1);
});

// Search Functionality
let currentSearchFocus = -1;

function performSearch(query) {
    const dropdown = document.getElementById('search-results-dropdown');
    const clearBtn = document.getElementById('search-clear-btn');
    
    if (!query || query.trim() === '') {
        dropdown.style.display = 'none';
        dropdown.innerHTML = '';
        clearBtn.style.display = 'none';
        currentSearchFocus = -1;
        return;
    }
    
    clearBtn.style.display = 'block';
    const cleanQuery = query.toLowerCase().trim();
    const results = [];
    
    // 1. Search Slides
    scenarios.forEach((s, idx) => {
        let score = 0;
        let matchReason = '';
        let matchedText = '';
        
        // Title match
        if (s.title.toLowerCase() === cleanQuery) {
            score += 150;
            matchReason = 'Exact Title';
            matchedText = s.title;
        } else if (s.title.toLowerCase().includes(cleanQuery)) {
            score += 80;
            matchReason = 'Title Match';
            matchedText = s.title;
        }
        
        // Chip/Tag match
        if (s.chips) {
            const matchedChip = s.chips.find(c => c.toLowerCase() === cleanQuery);
            if (matchedChip) {
                score += 100;
                matchReason = `Tag: ${matchedChip}`;
                matchedText = `Slide Tags: ${s.chips.join(', ')}`;
            } else {
                const partialChip = s.chips.find(c => c.toLowerCase().includes(cleanQuery));
                if (partialChip) {
                    score += 40;
                    matchReason = `Tag: ${partialChip}`;
                    matchedText = `Slide Tags: ${s.chips.join(', ')}`;
                }
            }
        }
        
        // Common interview questions match
        if (s.common_interview_questions) {
            const matchedQ = s.common_interview_questions.find(q => 
                q.question.toLowerCase().includes(cleanQuery) || 
                (q.answer && q.answer.toLowerCase().includes(cleanQuery))
            );
            if (matchedQ) {
                score += 50;
                matchReason = 'Interview Q&A';
                matchedText = `Q: ${matchedQ.question} - A: ${matchedQ.answer}`;
            }
        }
        
        // Core concepts match
        if (s.core_concepts) {
            const matchedConcept = s.core_concepts.find(c => 
                c.name.toLowerCase().includes(cleanQuery) || 
                (c.definition && c.definition.toLowerCase().includes(cleanQuery))
            );
            if (matchedConcept) {
                score += 40;
                matchReason = 'Core Concept';
                matchedText = `${matchedConcept.name}: ${matchedConcept.definition}`;
            }
        }
        
        // Text matches
        const d = s.data || s;
        if (d.definition && d.definition.toLowerCase().includes(cleanQuery)) {
            score += 30;
            if (!matchReason) { matchReason = 'Definition'; matchedText = d.definition; }
        }
        if (d.why_it_matters && d.why_it_matters.toLowerCase().includes(cleanQuery)) {
            score += 20;
            if (!matchReason) { matchReason = 'Why It Matters'; matchedText = d.why_it_matters; }
        }
        if (d.real_world_scenario && d.real_world_scenario.toLowerCase().includes(cleanQuery)) {
            score += 25;
            if (!matchReason) { matchReason = 'Real World'; matchedText = d.real_world_scenario; }
        }
        if (d.interview_answer) {
            if (d.interview_answer.response) {
                const matchedResp = d.interview_answer.response.find(r => r.toLowerCase().includes(cleanQuery));
                if (matchedResp) {
                    score += 35;
                    if (!matchReason) { matchReason = 'Interview Answer'; matchedText = matchedResp; }
                }
            }
            if (d.interview_answer.why && d.interview_answer.why.toLowerCase().includes(cleanQuery)) {
                score += 20;
                if (!matchReason) { matchReason = 'Interview Answer Why'; matchedText = d.interview_answer.why; }
            }
        }
        if (d.interview_kill_shot && d.interview_kill_shot.toLowerCase().includes(cleanQuery)) {
            score += 40;
            if (!matchReason) { matchReason = 'Interview Kill Shot'; matchedText = d.interview_kill_shot; }
        }
        if (d.code_examples) {
            const matchedCode = d.code_examples.find(c => 
                (c.title && c.title.toLowerCase().includes(cleanQuery)) || 
                (c.snippet && c.snippet.toLowerCase().includes(cleanQuery))
            );
            if (matchedCode) {
                score += 35;
                if (!matchReason) { matchReason = 'Code Example'; matchedText = `${matchedCode.title}: ${matchedCode.snippet}`; }
            }
        }
        
        if (score > 0) {
            results.push({
                type: 'slide',
                index: idx,
                title: s.title,
                score: score,
                reason: matchReason,
                snippet: matchedText || s.title
            });
        }
    });
    
    // 2. Search Glossary
    if (glossary && glossary.length > 0) {
        glossary.forEach((g) => {
            let score = 0;
            let matchReason = '';
            let matchedText = '';
            
            // Keyword match
            if (g.keyword.toLowerCase() === cleanQuery) {
                score += 160; // Slightly higher priority
                matchReason = 'Concept';
                matchedText = g.definition.shortDefinition;
            } else if (g.keyword.toLowerCase().includes(cleanQuery)) {
                score += 90;
                matchReason = 'Concept Match';
                matchedText = g.definition.shortDefinition;
            }
            
            // Aliases match
            if (g.aliases && g.aliases.length > 0) {
                const matchedAlias = g.aliases.find(a => a.toLowerCase() === cleanQuery);
                if (matchedAlias) {
                    score += 140;
                    matchReason = `Alias: ${matchedAlias}`;
                    matchedText = g.definition.shortDefinition;
                } else {
                    const partialAlias = g.aliases.find(a => a.toLowerCase().includes(cleanQuery));
                    if (partialAlias) {
                        score += 70;
                        matchReason = `Alias: ${partialAlias}`;
                        matchedText = g.definition.shortDefinition;
                    }
                }
            }
            
            // Category/Domain match
            if (g.category && g.category.toLowerCase() === cleanQuery) {
                score += 55;
                matchReason = `Category: ${g.category}`;
                matchedText = g.definition.shortDefinition;
            }
            
            // Definition match
            const def = g.definition;
            if (def) {
                if (def.shortDefinition && def.shortDefinition.toLowerCase().includes(cleanQuery)) {
                    score += 35;
                    if (!matchReason) { matchReason = 'Definition'; matchedText = def.shortDefinition; }
                }
                if (def.detailedExplanation && def.detailedExplanation.toLowerCase().includes(cleanQuery)) {
                    score += 25;
                    if (!matchReason) { matchReason = 'Explanation'; matchedText = def.detailedExplanation; }
                }
            }
            
            if (score > 0) {
                results.push({
                    type: 'glossary',
                    id: g.keywordId,
                    keyword: g.keyword,
                    score: score,
                    reason: matchReason,
                    snippet: matchedText || g.definition.shortDefinition
                });
            }
        });
    }
    
    results.sort((a, b) => b.score - a.score);
    
    if (results.length === 0) {
        dropdown.innerHTML = '<div style="padding: 10px; color: var(--text-muted); text-align: center; font-size: 13px;">No matching items found</div>';
        dropdown.style.display = 'flex';
        return;
    }
    
    const topResults = results.slice(0, 8);
    let html = '';
    topResults.forEach((res, rIdx) => {
        let snippetText = res.snippet;
        if (snippetText.length > 80) {
            snippetText = snippetText.substring(0, 80) + '...';
        }
        
        const escapedQuery = cleanQuery.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
        const regex = new RegExp(`(${escapedQuery})`, 'gi');
        const highlightedSnippet = snippetText.replace(regex, '<mark style="background: rgba(245, 158, 11, 0.3); color: #f59e0b; padding: 0 2px; border-radius: 2px; font-weight: 600;">$1</mark>');
        
        if (res.type === 'slide') {
            const highlightedTitle = res.title.replace(regex, '<mark style="background: rgba(245, 158, 11, 0.3); color: #f59e0b; padding: 0 2px; border-radius: 2px; font-weight: 600;">$1</mark>');
            html += `
            <div class="search-result-item" data-type="slide" data-index="${res.index}">
                <div class="search-result-header">
                    <span class="search-result-title">📄 Slide: ${highlightedTitle}</span>
                    <span class="search-result-reason" style="background: rgba(96, 165, 250, 0.12); color: #60A5FA; border: 1px solid rgba(96, 165, 250, 0.25);">${res.reason}</span>
                </div>
                <div class="search-result-snippet">
                    ${highlightedSnippet}
                </div>
            </div>`;
        } else {
            const highlightedKeyword = res.keyword.replace(regex, '<mark style="background: rgba(245, 158, 11, 0.3); color: #f59e0b; padding: 0 2px; border-radius: 2px; font-weight: 600;">$1</mark>');
            html += `
            <div class="search-result-item" data-type="glossary" data-id="${res.id}">
                <div class="search-result-header">
                    <span class="search-result-title">💡 Concept: ${highlightedKeyword}</span>
                    <span class="search-result-reason" style="background: rgba(167, 139, 250, 0.12); color: #A78BFA; border: 1px solid rgba(167, 139, 250, 0.25);">${res.reason}</span>
                </div>
                <div class="search-result-snippet">
                    ${highlightedSnippet}
                </div>
            </div>`;
        }
    });
    
    dropdown.innerHTML = html;
    dropdown.style.display = 'flex';
}

function selectSearchResult(element) {
    if (typeof element === 'number') {
        // Fallback support for old code calling index directly
        currentIndex = element;
        solutionRevealed = false;
        if (currentMode === 'glossary' || currentMode === 'flashcards') {
            setMode('learn');
        }
        renderScenario();
    } else {
        const type = element.dataset.type;
        if (type === 'slide') {
            const index = parseInt(element.dataset.index, 10);
            currentIndex = index;
            solutionRevealed = false;
            if (currentMode === 'glossary' || currentMode === 'flashcards') {
                setMode('learn');
            }
            renderScenario();
        } else if (type === 'glossary') {
            const id = element.dataset.id;
            setMode('glossary');
            showGlossaryTerm(id);
        }
    }
    
    // Reset search
    const searchInput = document.getElementById('search-input');
    searchInput.value = '';
    searchInput.blur();
    
    const dropdown = document.getElementById('search-results-dropdown');
    dropdown.style.display = 'none';
    dropdown.innerHTML = '';
    
    document.getElementById('search-clear-btn').style.display = 'none';
    currentSearchFocus = -1;
}

// Add event listeners for search input
document.addEventListener('DOMContentLoaded', () => {
    const searchInput = document.getElementById('search-input');
    const dropdown = document.getElementById('search-results-dropdown');
    const clearBtn = document.getElementById('search-clear-btn');
    
    if (!searchInput) return;
    
    searchInput.addEventListener('input', (e) => {
        performSearch(e.target.value);
    });
    
    searchInput.addEventListener('keydown', (e) => {
        const items = dropdown.querySelectorAll('.search-result-item');
        if (dropdown.style.display === 'flex' && items.length > 0) {
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                currentSearchFocus++;
                if (currentSearchFocus >= items.length) currentSearchFocus = 0;
                setActiveSearchItem(items);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                currentSearchFocus--;
                if (currentSearchFocus < 0) currentSearchFocus = items.length - 1;
                setActiveSearchItem(items);
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (currentSearchFocus > -1 && items[currentSearchFocus]) {
                    items[currentSearchFocus].click();
                } else if (items[0]) {
                    items[0].click();
                }
            } else if (e.key === 'Escape') {
                e.preventDefault();
                searchInput.value = '';
                dropdown.style.display = 'none';
                clearBtn.style.display = 'none';
                searchInput.blur();
                currentSearchFocus = -1;
            }
        } else if (e.key === 'Escape') {
            searchInput.value = '';
            clearBtn.style.display = 'none';
            searchInput.blur();
        }
    });
    
    function setActiveSearchItem(items) {
        items.forEach((item, index) => {
            if (index === currentSearchFocus) {
                item.classList.add('focus-item');
                item.scrollIntoView({ block: 'nearest' });
            } else {
                item.classList.remove('focus-item');
            }
        });
    }
    
    clearBtn.addEventListener('click', () => {
        searchInput.value = '';
        dropdown.style.display = 'none';
        dropdown.innerHTML = '';
        clearBtn.style.display = 'none';
        searchInput.focus();
        currentSearchFocus = -1;
    });
    
    // Click result selection
    dropdown.addEventListener('click', (e) => {
        const resultItem = e.target.closest('.search-result-item');
        if (resultItem) {
            selectSearchResult(resultItem);
        }
    });
    
    // Close dropdown when clicking outside
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-container')) {
            dropdown.style.display = 'none';
            currentSearchFocus = -1;
        }
    });
});

// Initialize first render
loadScenarios();

// Auto-hide Navbar on Scroll Down
let lastScrollTop = 0;
window.addEventListener('scroll', function() {
    let st = window.pageYOffset || document.documentElement.scrollTop;
    const navbar = document.querySelector('.nav-bar');
    if (st > lastScrollTop && st > 60) {
        // Scroll Down -> Hide
        navbar.style.top = '-150px';
    } else {
        // Scroll Up -> Show
        navbar.style.top = '8px';
    }
    lastScrollTop = st <= 0 ? 0 : st;
}, { passive: true });
